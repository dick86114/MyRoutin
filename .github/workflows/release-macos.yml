name: 发布 macOS
run-name: 发布 macOS v${{ inputs.version }} · ${{ inputs.release_notes }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'macOS 版本号（例如 1.2.0）'
        required: true
        type: string
      release_notes:
        description: 'macOS 发布说明（Markdown，首行用于工作流名称）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: 构建 macOS DMG v${{ inputs.version }}
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 校验版本号
        run: |
          [[ "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: 写入发布摘要
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          {
            echo "## MyToken macOS v${RELEASE_VERSION}"
            echo
            printf '%s\n' "${RELEASE_NOTES}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 校验 Xcode 26 与 macOS 26 SDK
        run: scripts/verify-xcode.sh
      - name: 安装 XcodeGen
        run: brew install xcodegen
      - name: 写入应用版本
        run: |
          sed -i '' "s/MARKETING_VERSION: \"[^\"]*\"/MARKETING_VERSION: \"${RELEASE_VERSION}\"/" project.yml
      - name: 构建 DMG
        run: scripts/build-dmg.sh
      - name: 重命名安装包
        run: |
          arch="$(uname -m)"
          dmg_name="MyToken-${RELEASE_VERSION}-${arch}.dmg"
          cp "build/dist/MyToken.dmg" "build/dist/${dmg_name}"
          echo "dmg_name=${dmg_name}" >> "$GITHUB_ENV"
      - name: 创建 macOS Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: macos-v${{ inputs.version }}
          name: MyToken macOS v${{ inputs.version }}
          body: ${{ inputs.release_notes }}
          generate_release_notes: false
          make_latest: false
          files: |
            build/dist/MyToken.dmg
            build/dist/${{ env.dmg_name }}
      - name: 创建旧版兼容 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: MyToken v${{ inputs.version }}
          body: ${{ inputs.release_notes }}
          generate_release_notes: false
          make_latest: true
          files: |
            build/dist/MyToken.dmg
            build/dist/${{ env.dmg_name }}
