name: Android CI

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

jobs:
  jvm-tests:
    name: Android JVM 单元测试与 instrumented 构建验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub 托管的 ubuntu runner 预装 Android SDK（ANDROID_HOME 已指向
      # commandlinetools）；显式声明便于在自托管 runner 上复用同一工作流。
      - name: 检查 Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$HOME/android-sdk}"
          if ! command -v sdkmanager >/dev/null 2>&1 && [ ! -d "${ANDROID_HOME:-}" ]; then
            echo "::error::未找到 Android SDK，请在 runner 上安装并设置 ANDROID_HOME"
            exit 1
          fi

      # 注意：android/local.properties 是本机文件，不入库；CI 直接使用
      # 环境变量 ANDROID_HOME 定位 SDK。
      - name: JVM 单元测试（全部模块）
        working-directory: android
        run: ./gradlew test --stacktrace

      # instrumented 测试（app/src/androidTest）在 CI 上仅做编译验证。
      # connectedAndroidTest 需要模拟器或真机：GitHub 托管 runner 不提供硬件
      # 加速 KVM 之外的可靠模拟器环境，如需执行请配置 self-hosted runner
      # （带 KVM 或物理设备，通过 adb devices 暴露），然后启用下方
      # connectedCheck 步骤。
      - name: 编译 instrumented 测试 APK
        working-directory: android
        run: ./gradlew :app:assembleDebugAndroidTest --stacktrace

      # - name: connectedAndroidTest（self-hosted runner + 模拟器/真机）
      #   working-directory: android
      #   run: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: 汇总测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: android/**/build/test-results/**/*.xml
          if-no-files-found: warn

  # macOS CI 继续执行 scripts/test.sh（保持 ci.yml 既有语义，此处不重复跑，
  # 仅作为文档锚点：macOS 侧验证入口是根目录 .github/workflows/ci.yml）。
