name: 发布版本

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 1.2.0，将创建 v1.2.0 标签）'
        required: true
        type: string
      release_notes:
        description: '发布说明（Markdown）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos:
    name: 构建 macOS DMG
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验版本号
        run: |
          [[ "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: 校验 Xcode 26 与 macOS 26 SDK
        run: scripts/verify-xcode-26.sh

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 写入应用版本
        run: |
          sed -i '' "s/MARKETING_VERSION: \"[^\"]*\"/MARKETING_VERSION: \"${RELEASE_VERSION}\"/" project.yml

      - name: 构建 DMG
        run: scripts/build-dmg.sh

      - name: 重命名安装包
        run: |
          arch="$(uname -m)"
          dmg_name="MyToken-${RELEASE_VERSION}-${arch}.dmg"
          cp "build/dist/MyToken.dmg" "build/dist/${dmg_name}"
          echo "dmg_name=${dmg_name}" >> "$GITHUB_ENV"

      - name: 上传 macOS 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            build/dist/MyToken.dmg
            build/dist/${{ env.dmg_name }}
          if-no-files-found: error

  android:
    name: 构建 Android APK
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 校验版本号
        run: |
          [[ "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: 写入 Android 版本
        run: |
          version_code="${GITHUB_RUN_NUMBER:-1}"
          sed -i "s/versionCode = [0-9][0-9]*/versionCode = ${version_code}/" android/app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"${RELEASE_VERSION}\"/" android/app/build.gradle.kts

      - name: 测试并构建 APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          args=(test)

          if [[ -n "${ANDROID_KEYSTORE_BASE64}" && -n "${ANDROID_KEYSTORE_PASSWORD}" && -n "${ANDROID_KEY_ALIAS}" && -n "${ANDROID_KEY_PASSWORD}" ]]; then
            key_path="${RUNNER_TEMP}/mytoken-release.jks"
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${key_path}"
            args+=(
              "-Pandroid.injected.signing.store.file=${key_path}"
              "-Pandroid.injected.signing.store.password=${ANDROID_KEYSTORE_PASSWORD}"
              "-Pandroid.injected.signing.key.alias=${ANDROID_KEY_ALIAS}"
              "-Pandroid.injected.signing.key.password=${ANDROID_KEY_PASSWORD}"
              ":app:assembleRelease"
            )
            apk_source="android/app/build/outputs/apk/release/app-release.apk"
            apk_name="MyToken-${RELEASE_VERSION}-android.apk"
          else
            echo "::warning::未配置 Android 签名 secrets，本次发布 APK 将使用 Debug 签名。"
            args+=(":app:assembleDebug")
            apk_source="android/app/build/outputs/apk/debug/app-debug.apk"
            apk_name="MyToken-${RELEASE_VERSION}-android-debug.apk"
          fi

          ./gradlew "${args[@]}" --stacktrace
          mkdir -p android/build/dist
          cp "${apk_source}" "android/build/dist/${apk_name}"
          echo "apk_name=${apk_name}" >> "$GITHUB_ENV"

      - name: 上传 Android 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/build/dist/${{ env.apk_name }}
          if-no-files-found: error

  release:
    name: 创建 GitHub Release
    runs-on: ubuntu-latest
    needs:
      - macos
      - android
    steps:
      - name: 下载 macOS 构建产物
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: release/macos

      - name: 下载 Android 构建产物
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release/android

      - name: 检查构建产物
        run: |
          find release -maxdepth 3 -type f -print
          test -n "$(find release -type f -name '*.apk' -print -quit)"
          test -n "$(find release -type f -name '*.dmg' -print -quit)"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: MyToken v${{ inputs.version }}
          body: ${{ inputs.release_notes }}
          generate_release_notes: false
          files: |
            release/macos/*.dmg
            release/android/*.apk
