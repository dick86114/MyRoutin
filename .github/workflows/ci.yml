name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: 校验 Xcode 26 与 macOS 26 SDK
        run: scripts/verify-xcode.sh
      - name: 安装 XcodeGen
        run: brew install xcodegen
      - name: 执行单元测试
        run: scripts/test.sh
      - name: 构建 DMG
        run: scripts/build-dmg.sh
      - name: 上传 DMG 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MyToken-dmg
          path: build/dist/MyToken.dmg
          if-no-files-found: error
