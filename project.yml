name: RoutinUsage
options:
  projectFormat: xcode15_3
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: cc.idickies.mytoken
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSUIElement: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  RoutinUsage:
    type: application
    platform: macOS
    sources: [RoutinUsage]
    settings:
      base:
        PRODUCT_NAME: "MyToken"
        PRODUCT_MODULE_NAME: RoutinUsage
      configs:
        debug:
          PRODUCT_BUNDLE_IDENTIFIER: ai.routin.mytoken.debug.v3
  RoutinUsageTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - RoutinUsageTests
      - path: scripts/build-dmg.sh
        buildPhase: resources
      - path: scripts/test.sh
        buildPhase: resources
      - path: scripts/verify-xcode-26.sh
        buildPhase: resources
      - path: project.yml
        buildPhase: resources
      - path: docs/brand-assets/routin-menu-bar-logo-source.png
        buildPhase: resources
    preBuildScripts:
      - name: 同步静态源码测试资源
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          resource_dir="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "$resource_dir"
          cp "$PROJECT_DIR/RoutinUsage/App/RoutinUsageApp.swift" "$resource_dir/RoutinUsageApp.swift.txt"
          cp "$PROJECT_DIR/RoutinUsage/App/AppEnvironment.swift" "$resource_dir/AppEnvironment.swift.txt"
          cp "$PROJECT_DIR/RoutinUsage/Views/Settings/SettingsWindowView.swift" "$resource_dir/SettingsWindowView.swift.txt"
          cp "$PROJECT_DIR/RoutinUsage/Views/Settings/MenuBarManagementView.swift" "$resource_dir/MenuBarManagementView.swift.txt"
          cp "$PROJECT_DIR/RoutinUsage/Views/Settings/GeneralSettingsView.swift" "$resource_dir/GeneralSettingsView.swift.txt"
          cp "$PROJECT_DIR/RoutinUsage/Views/Settings/HelpUpdateView.swift" "$resource_dir/HelpUpdateView.swift.txt"
          cp "$PROJECT_DIR/RoutinUsage/Views/Settings/CredentialManagementView.swift" "$resource_dir/CredentialManagementView.swift.txt"
          cp "$PROJECT_DIR/RoutinUsage/Views/Settings/CredentialManagementModel.swift" "$resource_dir/CredentialManagementModel.swift.txt"
          cp "$PROJECT_DIR/RoutinUsage/Views/Settings/CredentialAlertSettingsModel.swift" "$resource_dir/CredentialAlertSettingsModel.swift.txt"
          cp "$PROJECT_DIR/RoutinUsage/Views/Settings/CredentialAlertSettingsView.swift" "$resource_dir/CredentialAlertSettingsView.swift.txt"
          cp "$PROJECT_DIR/RoutinUsage/Views/Settings/Components/CredentialSummaryRow.swift" "$resource_dir/CredentialSummaryRow.swift.txt"
          cp "$PROJECT_DIR/RoutinUsage/Views/Settings/Components/ProviderFilterChips.swift" "$resource_dir/ProviderFilterChips.swift.txt"
          cp "$PROJECT_DIR/RoutinUsage/Views/Settings/Components/MenuBarIndicatorPreview.swift" "$resource_dir/MenuBarIndicatorPreview.swift.txt"
          cp "$PROJECT_DIR/RoutinUsage/Views/Settings/Components/ReorderableCredentialCardList.swift" "$resource_dir/ReorderableCredentialCardList.swift.txt"
          cp "$PROJECT_DIR/RoutinUsage/Views/Settings/Components/SettingsPageHeader.swift" "$resource_dir/SettingsPageHeader.swift.txt"
          cp "$PROJECT_DIR/RoutinUsage/Views/UpdateNotesView.swift" "$resource_dir/UpdateNotesView.swift.txt"
          cp "$PROJECT_DIR/RoutinUsage/Views/KeyEditorView.swift" "$resource_dir/KeyEditorView.swift.txt"
          cp "$PROJECT_DIR/RoutinUsage/Views/OnboardingView.swift" "$resource_dir/OnboardingView.swift.txt"
          cp "$PROJECT_DIR/RoutinUsage/Views/UsageRowView.swift" "$resource_dir/UsageRowView.swift.txt"
          cp "$PROJECT_DIR/RoutinUsage/Views/NormalizedUsageMetricGrid.swift" "$resource_dir/NormalizedUsageMetricGrid.swift.txt"
          cp "$PROJECT_DIR/RoutinUsage/Models/MenuBarStyle.swift" "$resource_dir/MenuBarStyle.swift.txt"
          cp "$PROJECT_DIR/RoutinUsage/App/StatusBarController.swift" "$resource_dir/StatusBarController.swift.txt"
          cp "$PROJECT_DIR/RoutinUsage/Updates/GitHubUpdateService.swift" "$resource_dir/GitHubUpdateService.swift.txt"
          cp "$PROJECT_DIR/RoutinUsage/Views/UsagePopoverView.swift" "$resource_dir/UsagePopoverView.swift.txt"
          cp "$PROJECT_DIR/RoutinUsage/Views/LiquidGlassSurface.swift" "$resource_dir/LiquidGlassSurface.swift.txt"
          cp "$PROJECT_DIR/RoutinUsage/GroupDetection/RoutinGroupDetectionWebSession.swift" "$resource_dir/RoutinGroupDetectionWebSession.swift.txt"
          cp "$PROJECT_DIR/.github/workflows/ci.yml" "$resource_dir/ci.yml"
          cp "$PROJECT_DIR/.github/workflows/release.yml" "$resource_dir/release.yml"
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MyToken.app/Contents/MacOS/MyToken"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: RoutinUsage
schemes:
  RoutinUsage:
    build:
      targets:
        RoutinUsage: all
        RoutinUsageTests: [test]
    test:
      targets: [RoutinUsageTests]
